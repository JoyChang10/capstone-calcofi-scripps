name: Multi-Dataset Pipeline

on:
  workflow_dispatch:

jobs:
  run-multi-dataset-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "DBI",
            "duckdb",
            "dplyr",
            "readr",
            "tidyr",
            "yaml",
            "lubridate",
            "glue",
            "janitor",
            "optparse"
          ), repos = "https://cloud.r-project.org")'

      - name: List available config files
        run: |
          echo "Config files found:"
          ls -lh config/*.yaml

      - name: Run generalized pipeline for each config
        run: |
          set -e

          for config in config/*.yaml; do
            echo "======================================"
            echo "Running pipeline with config: $config"
            echo "======================================"

            Rscript R/generalized_ingest.R --config "$config"

            echo "Finished pipeline for: $config"
          done